server:
  port: 8084

spring:
  application:
    name: payment-webhook-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

payment:
  webhook:
    secret-key: ${PAYMENT_WEBHOOK_SECRET:super-secret-webhook-key-change-in-prod}
