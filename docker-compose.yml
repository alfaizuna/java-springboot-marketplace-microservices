# ==============================================================================
# Docker Compose — Marketplace Microservices
# Services: PostgreSQL, Redis, api-gateway, auth-service, product-service,
#           order-service, payment-webhook-service
# Entry point: http://localhost:8080 (api-gateway)
# ==============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure: PostgreSQL (multi-database via init-dbs.sh)
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-marketplace_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-marketplace_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marketplace-network

  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure: Redis (token blacklist + idempotency)
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  # ──────────────────────────────────────────────────────────────────────────
  # Auth Service — Port 8081 | DB: auth_db
  # Handles: Register, Login, JWT RS256, Refresh Token, Logout
  # ──────────────────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: marketplace/auth-service:latest
    container_name: marketplace-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/auth_db
      DATABASE_USERNAME: ${DB_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-604800000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - marketplace-network

  # ──────────────────────────────────────────────────────────────────────────
  # Product Service — Port 8082 | DB: product_db
  # Handles: Product catalog, stock check (internal), ADMIN create
  # ──────────────────────────────────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: marketplace/product-service:latest
    container_name: marketplace-product-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/product_db
      DATABASE_USERNAME: ${DB_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - marketplace-network

  # ──────────────────────────────────────────────────────────────────────────
  # Order Service — Port 8083 | DB: order_db
  # Handles: Order creation (with stock check), status, webhook simulator
  # ──────────────────────────────────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: marketplace/order-service:latest
    container_name: marketplace-order-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/order_db
      DATABASE_USERNAME: ${DB_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-super-secret-webhook-key-change-in-prod}
      PRODUCT_SERVICE_URL: http://product-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - marketplace-network

  # ──────────────────────────────────────────────────────────────────────────
  # Payment Webhook Service — Port 8084 | DB: payment_db
  # Handles: HMAC-SHA256 signature validation, Redis idempotency
  # ──────────────────────────────────────────────────────────────────────────
  payment-webhook-service:
    build:
      context: .
      dockerfile: payment-webhook-service/Dockerfile
    image: marketplace/payment-webhook-service:latest
    container_name: marketplace-payment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payment_db
      DATABASE_USERNAME: ${DB_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-super-secret-webhook-key-change-in-prod}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - marketplace-network

  # ──────────────────────────────────────────────────────────────────────────
  # API Gateway — Port 8080 (Single Entry Point)
  # Handles: JWT RS256 validation, route forwarding, X-User-* header injection
  # ──────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: marketplace/api-gateway:latest
    container_name: marketplace-api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-webhook-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_WEBHOOK_SERVICE_URL: http://payment-webhook-service:8084
    networks:
      - marketplace-network

# ────────────────────────────────────────────────────────────────────────────
# Volumes & Networks
# ────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  marketplace-network:
    driver: bridge
