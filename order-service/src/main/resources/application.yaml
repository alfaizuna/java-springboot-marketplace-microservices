server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

payment:
  webhook:
    secret-key: ${PAYMENT_WEBHOOK_SECRET:super-secret-webhook-key-change-in-prod}

# Internal service URLs (direct, not through gateway)
services:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
